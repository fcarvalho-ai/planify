        itemCount: { type: integer, minimum: 0 }
    FinanceAnalyticsResponse:
      type: object
      required: [definitionVersion, generatedAt, items, itemCount, page, pageSize, pageCount]
      properties:
        definitionVersion: { type: string }
        generatedAt: { type: string, format: date-time }
        period: { type: object, additionalProperties: true }
        filters: { type: object, additionalProperties: true }
        totals: { type: object, additionalProperties: true }
        items: { type: array, maxItems: 1000, items: { type: object, additionalProperties: true } }
        itemCount: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 500 }
        pageCount: { type: integer, minimum: 0 }
      additionalProperties: true
    OccupancyThresholdCommand:
      type: object
      additionalProperties: false
      required: [underutilizedBps, saturatedBps]
      properties:
        siteId: { type: [string, 'null'] }
        underutilizedBps: { type: integer, minimum: 0, maximum: 19999 }
        saturatedBps: { type: integer, minimum: 1, maximum: 20000 }
        version: { type: integer, minimum: 1 }
    OccupancyThreshold:
      allOf:
        - { $ref: '#/components/schemas/OccupancyThresholdCommand' }
        - type: object
          required: [id, companyId, version, createdAt, updatedAt]
          properties:
            id: { type: string }
            companyId: { type: string, readOnly: true }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ReservationPresenceCommand:
      type: object
      additionalProperties: false
      required: [version, intent]
      properties:
        version: { type: integer, minimum: 1 }
        intent: { type: string, enum: [editing, moving, resizing] }
    ReservationPresence:
      type: object
      required: [reservationId, siteId, actorUserId, actorDisplayName, intent, acquiredAt, expiresAt]
      properties:
        reservationId: { type: string }
        siteId: { type: string }
        projectId: { type: string }
        actorUserId: { type: string }
        actorDisplayName: { type: string, maxLength: 120 }
        intent: { type: string, enum: [editing, moving, resizing] }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReservationPresenceList:
      type: object
      required: [items, ttlMs]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReservationPresence' } }
        ttlMs: { type: integer, minimum: 1000 }
  responses:
    Unauthorized: { description: Session absente ou expirée, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: Permission insuffisante, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Élément absent ou hors scope, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: Conflit métier, de version ou d'idempotence, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ValidationError: { description: Entrée invalide, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
