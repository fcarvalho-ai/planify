openapi: 3.1.0
info:
  title: Planify ELIOTE/FAV API
  version: 1.0.0-sprint1
  description: Contrat V1. Les routes RC1 non encore enveloppées restent documentées comme compatibilité transitoire.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
  - name: Users
  - name: Clients
  - name: Projects
  - name: Sites
  - name: Services
  - name: Resources
  - name: Pricing
  - name: Commercial
  - name: Analytics
  - name: Audit
  - name: Foundation
  - name: Planning
  - name: PlanyBot
  - name: People
  - name: Actuals
  - name: Finance
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /memberships:
    get:
      operationId: listUserMemberships
      tags: [Users]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Utilisateurs et adhésions visibles dans la société active, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /memberships/{membershipId}/scopes:
    put:
      operationId: replaceMembershipScopes
      tags: [Users]
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipScopeCommand' }
            example:
              version: 1
              scope: sites
              siteIds: [site_paris]
              organizationUnitIds: []
              projectIds: [project_1]
              entityScopes: { resource: [resource_1], client: [client_1] }
      responses:
        '200': { description: Membership mise à jour avec scopes projet et entité persistés, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /roles:
    get:
      operationId: listRoles
      tags: [Users]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Catalogue des rôles du tenant actif, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
  /clients:
    get:
      operationId: listClients
      tags: [Clients]
      x-rc1-response: unwrapped
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Clients du tenant courant, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createClient
      tags: [Clients]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreateCommand' } } } }
      responses:
        '201': { description: Client créé avec son contrat de facturation canonique, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      x-rc1-response: unwrapped
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { name: lifecycleStatus, in: query, schema: { $ref: '#/components/schemas/ProjectLifecycleStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Projets bornés aux scopes serveur avec cycle Sprint 1 canonique, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createProject
      tags: [Projects]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreateCommand' } } } }
      responses:
        '201': { description: Projet créé avec responsabilités actives du tenant, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sites:
    get:
      operationId: listSites
      tags: [Sites]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Sites accessibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
  /service-offerings:
    get:
      operationId: listServices
      tags: [Services]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Prestations structurées actives et accessibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
  /resources:
    get:
      operationId: listResources
      tags: [Resources]
      x-rc1-response: unwrapped
      parameters: [{ $ref: '#/components/parameters/SiteId' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Ressources accessibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createResource
      tags: [Resources]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCreateCommand' } } } }
      responses:
        '201': { description: Ressource rattachée à une catégorie de son site, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /resource-categories:
    get:
      operationId: listResourceCategories
      tags: [Resources]
      x-rc1-response: unwrapped
      parameters: [{ $ref: '#/components/parameters/SiteId' }, { name: resourceType, in: query, schema: { $ref: '#/components/schemas/ResourceType' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Catégories accessibles du tenant et du site, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createResourceCategory
      tags: [Resources]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCategoryCreateCommand' } } } }
      responses:
        '201': { description: Catégorie créée, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCategory' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /resource-categories/{categoryId}:
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateResourceCategory
      tags: [Resources]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCategoryPatchCommand' } } } }
      responses:
        '200': { description: Catégorie modifiée, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCategory' } } } }
        '409': { description: Catégorie utilisée ou conflit de version }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: archiveResourceCategory
      tags: [Resources]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Catégorie archivée logiquement, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceCategory' } } } }
        '409': { description: Catégorie encore utilisée ou conflit de version }
  /rate-cards:
    get:
      operationId: listPricingGrids
      tags: [Pricing]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Grilles tarifaires autorisées, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
  /rates:
    get:
      operationId: listRates
      tags: [Pricing]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Tarifs accessibles après contrôle serveur, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createRate
      tags: [Pricing]
      description: Crée un tarif commercial comportant un coût interne. Requiert quote.manage et finance.cost.manage.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateCreateCommand' }
      responses:
        '201': { description: Tarif créé. Le coût interne est omis sans finance.read., content: { application/json: { schema: { $ref: '#/components/schemas/RateResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotes:
    get:
      operationId: listCommercialDocuments
      tags: [Commercial]
      x-rc1-response: unwrapped
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [budget, quote] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Budgets ou devis accessibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
  /dashboard/revenue:
    get:
      operationId: getRevenueRecognition
      tags: [Analytics]
      responses:
        '200': { description: CA issu des versions de devis acceptées, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard/occupancy:
    get:
      operationId: getPlanningAnalytics
      tags: [Analytics]
      responses:
        '200': { description: Occupation et capacité du planning, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /planning/conflicts/check:
    post:
      operationId: checkPlanningConflicts
      tags: [Planning]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCommand' }
      responses:
        '200': { description: Résultat de disponibilité sans écriture, content: { application/json: { schema: { type: object } } } }
  /audit:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      x-rc1-response: unwrapped
      responses:
        '200': { description: Audit du tenant courant, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /technical-metrics:
    get:
      operationId: getTechnicalMetrics
      tags: [Foundation]
      responses:
        '200': { description: Compteurs, latence API, SSE et événements sans données métier, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /person-skills:
    get:
      operationId: listPersonSkills
      tags: [People]
      parameters:
        - { name: membershipId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Compétences visibles dans le périmètre Planning, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createPersonSkill
      tags: [People]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonSkillCommand' } } } }
      responses:
        '201': { description: Compétence structurée créée, content: { application/json: { schema: { $ref: '#/components/schemas/PersonSkill' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /personnel-directory:
    get:
      operationId: listPersonnelDirectory
      tags: [People]
      description: Annuaire opérationnel minimal, filtré par société et périmètre de planification. Ne retourne ni e-mail, ni rôle, ni scope de gouvernance. Requiert planning.read.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Personnes actives visibles dans le périmètre Planning, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /person-skills/{skillId}:
    delete:
      operationId: archivePersonSkill
      tags: [People]
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses:
        '200': { description: Compétence archivée, content: { application/json: { schema: { $ref: '#/components/schemas/PersonSkill' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /person-unavailabilities:
    get:
      operationId: listPersonUnavailabilities
      tags: [People]
      parameters:
        - { name: membershipId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Indisponibilités visibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
    post:
      operationId: createPersonUnavailability
      tags: [People]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonUnavailabilityCommand' } } } }
      responses:
        '201': { description: Indisponibilité créée, content: { application/json: { schema: { $ref: '#/components/schemas/PersonUnavailability' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /person-unavailabilities/{unavailabilityId}:
    delete:
      operationId: cancelPersonUnavailability
      tags: [People]
      parameters:
        - { name: unavailabilityId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses:
        '200': { description: Indisponibilité annulée, content: { application/json: { schema: { $ref: '#/components/schemas/PersonUnavailability' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /plany/messages:
    post:
      operationId: postPlanyMessage
      tags: [PlanyBot]
      description: Produit une réponse factuelle et, le cas échéant, une proposition persistée. Ne crée jamais de réservation.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanyMessageCommand' }
      responses:
        '201': { description: Réponse et propositions sans mutation métier, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /plany/conversations/{conversationId}/messages:
    get:
      operationId: listPlanyConversationMessages
      tags: [PlanyBot]
      description: Relit une conversation après revalidation des projets, sites, ressources, réservations, devis, imports et personnes effectivement exposés par chaque réponse.
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Historique autorisé, content: { application/json: { schema: { type: object, required: [conversationId, items], properties: { conversationId: { type: string }, items: { type: array, maxItems: 50, items: { type: object, additionalProperties: true } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plany/proposals/{proposalId}:
    get:
      operationId: getPlanyProposal
      tags: [PlanyBot]
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Proposition autorisée, content: { application/json: { schema: { $ref: '#/components/schemas/PlanyProposal' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /plany/proposals/{proposalId}/confirm:
    post:
      operationId: confirmPlanyProposal
      tags: [PlanyBot]
      description: Revalide droits, scopes, versions, disponibilité et capacité, puis appelle le moteur Réservation après confirmation humaine.
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalDigest]
              properties: { proposalDigest: { type: string, minLength: 32, maxLength: 128 } }
      responses:
        '201': { description: Proposition exécutée, content: { application/json: { schema: { $ref: '#/components/schemas/PlanyProposalExecution' } } } }
        '200': { description: Rejeu idempotent, content: { application/json: { schema: { $ref: '#/components/schemas/PlanyProposalExecution' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plany/proposals/{proposalId}/reject:
    post:
      operationId: rejectPlanyProposal
      tags: [PlanyBot]
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        '200': { description: Proposition refusée ou rejeu, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /actuals/pending:
    get:
      operationId: listPendingActuals
      tags: [Actuals]
      description: File dérivée des réservations terminées confirmées ou réalisées. Cette lecture ne crée aucune donnée.
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Réalisations à confirmer dans les scopes courants, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /actuals:
    get:
      operationId: listActuals
      tags: [Actuals]
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: reservationId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Réalisations visibles, content: { application/json: { schema: { $ref: '#/components/schemas/Rc1List' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actuals/{actualId}:
    get:
      operationId: getActual
      tags: [Actuals]
      parameters:
        - { name: actualId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Réalisation et révisions append-only, content: { application/json: { schema: { $ref: '#/components/schemas/ActualRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /actuals/{actualId}/revisions:
    post:
      operationId: correctActual
      tags: [Actuals]
      parameters:
        - { name: actualId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActualCorrectionCommand' } } } }
      responses:
        '201': { description: Nouvelle révision append-only, content: { application/json: { schema: { $ref: '#/components/schemas/ActualRecord' } } } }
        '200': { description: Rejeu idempotent, content: { application/json: { schema: { $ref: '#/components/schemas/ActualRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reservations/{reservationId}/actual:
    get:
      operationId: getReservationActual
      tags: [Actuals]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Réalisation ou état pending et snapshot planifié, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{reservationId}/actual/confirm:
    post:
      operationId: confirmReservationActual
      tags: [Actuals]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActualConfirmCommand' } } } }
      responses:
        '201': { description: Réalisation confirmée et historisée, content: { application/json: { schema: { $ref: '#/components/schemas/ActualRecord' } } } }
        '200': { description: Rejeu idempotent, content: { application/json: { schema: { $ref: '#/components/schemas/ActualRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reservations:
    get:
      operationId: listReservations
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Réservations bornées au scope serveur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rc1List' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createReservation
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCommand' }
            example:
              siteId: site_paris
              projectId: project_1
              title: Montage émission
              startsAt: '2026-08-24T07:00:00.000Z'
              endsAt: '2026-08-24T16:00:00.000Z'
              status: confirmed
