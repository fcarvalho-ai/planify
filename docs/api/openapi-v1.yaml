      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: projectCostId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCostPatchCommand' } } } }
      responses:
        '200': { description: Dépense corrigée et ancienne version conservée, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCost' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /analytics/margins:
    get:
      operationId: readMargins
      tags: [Finance, Analytics]
      parameters: [{ name: projectId, in: query, schema: { type: string } }, { name: asOf, in: query, schema: { type: string, format: date } }]
      responses:
        '200': { description: Marges calculées uniquement sur le sous-ensemble autorisé, content: { application/json: { schema: { $ref: '#/components/schemas/MarginAnalytics' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    SiteId: { name: siteId, in: query, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
  schemas:
    ActualValueFields:
      type: object
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        quantityMilli: { type: string, pattern: '^\d+$' }
        unit: { type: string, enum: [heure, demi_journee, jour, semaine, mois, forfait, unite, go_mois, to_mois], description: Doit rester identique à l’unité du snapshot planifié. Toute conversion d’unité exige un contrat versionné distinct. }
    ActualConfirmCommand:
      allOf:
        - { $ref: '#/components/schemas/ActualValueFields' }
        - type: object
          required: [reservationVersion]
          properties:
            reservationVersion: { type: integer, minimum: 1 }
            deviationReason: { type: string, minLength: 3, maxLength: 1000 }
    ActualCorrectionCommand:
      allOf:
        - { $ref: '#/components/schemas/ActualValueFields' }
        - type: object
          required: [actualVersion, correctionReason]
          properties:
            actualVersion: { type: integer, minimum: 1 }
            correctionReason: { type: string, minLength: 3, maxLength: 1000 }
    ActualRevision:
      allOf:
        - { $ref: '#/components/schemas/ActualValueFields' }
        - type: object
          required: [id, actualRecordId, revisionNumber, confirmationKind, sourceReservationVersion, priorRevisionId, confirmedBy, confirmedAt, digestVersion, sourceDigest, createdBy, createdAt]
          properties:
            id: { type: string }
            actualRecordId: { type: string }
            revisionNumber: { type: integer, minimum: 1 }
            confirmationKind: { type: string, enum: [confirmed, corrected] }
            deviationReason: { type: string }
            correctionReason: { type: string }
            sourceReservationVersion: { type: integer, minimum: 1 }
            priorRevisionId: { type: [string, 'null'] }
            confirmedBy: { type: string }
            confirmedAt: { type: string, format: date-time }
            digestVersion: { type: integer, enum: [1, 2, 3], description: La version 3 protège également l’instantané de coût interne. }
            costSnapshot:
              type: object
              readOnly: true
              description: Présent uniquement si l’acteur possède finance.read. Cet instantané historique n’est jamais recalculé depuis le tarif courant.
              required: [policyVersion, state, at, unit, entries, missingAllocationCount, totalMinor]
              properties:
                policyVersion: { type: string, enum: ['SPRINT7_FINANCE@1'] }
                state: { type: string, enum: [resolved, partial, unavailable] }
                at: { type: string, format: date }
                unit: { type: string }
                entries:
                  type: array
                  items:
                    type: object
                    required: [resourceId, quantityMilli, allocationQuantity, costRateId, costRateVersion, costUnitMinor, amountMinor, currency, resolvedAt]
                    properties:
                      resourceId: { type: string }
                      quantityMilli: { type: string, pattern: '^\d+$' }
                      allocationQuantity: { type: string, pattern: '^\d+$' }
                      costRateId: { type: string }
                      costRateVersion: { type: integer, minimum: 1 }
                      costUnitMinor: { type: string, pattern: '^\d+$' }
                      amountMinor: { type: string, pattern: '^\d+$' }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      resolvedAt: { type: string, format: date-time }
                missingAllocationCount: { type: integer, minimum: 0 }
                totalMinor: { type: string, pattern: '^\d+$' }
            sourceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
    ActualReconciliation:
      type: object
      required: [soldQuantityMilli, plannedQuantityMilli, actualQuantityMilli, plannedDeviationQuantityMilli, soldDeviationQuantityMilli, billableQuantityMilli, state, commercialState, amountVisibility]
      properties:
        soldQuantityMilli: { type: string, pattern: '^-?\d+$' }
        plannedQuantityMilli: { type: string, pattern: '^-?\d+$' }
        actualQuantityMilli: { type: string, pattern: '^-?\d+$' }
        plannedDeviationQuantityMilli: { type: string, pattern: '^-?\d+$' }
        soldDeviationQuantityMilli: { type: string, pattern: '^-?\d+$' }
        billableQuantityMilli: { type: string, pattern: '^\d+$' }
        state: { type: string, enum: [compliant, overActual, underActual] }
        commercialState: { type: string, enum: [matched, unmatched] }
        quoteId: { type: [string, 'null'] }
        quoteLineId: { type: [string, 'null'] }
        currency: { type: [string, 'null'] }
        billableValueMinor: { type: [string, 'null'], pattern: '^\d+$' }
        amountVisibility: { type: string, enum: [available, restricted] }
    ActualRecord:
      type: object
      required: [id, companyId, reservationId, projectId, sourceReservationVersion, plannedSnapshot, currentRevisionId, version, currentRevision, reconciliation]
      properties:
        id: { type: string }
        companyId: { type: string, readOnly: true }
        reservationId: { type: string }
        projectId: { type: string }
        siteId: { type: [string, 'null'] }
        sourceReservationVersion: { type: integer, minimum: 1 }
        sourceQuoteId: { type: [string, 'null'] }
        sourceQuoteVersionId: { type: [string, 'null'] }
        sourceQuoteLineId: { type: [string, 'null'] }
        plannedSnapshot: { type: object, additionalProperties: true, readOnly: true }
        reservation:
          type: [object, 'null']
          additionalProperties: false
          properties:
            id: { type: string }
            title: { type: string }
            status: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
        currentRevisionId: { type: string }
        currentRevision: { $ref: '#/components/schemas/ActualRevision' }
        reconciliation: { $ref: '#/components/schemas/ActualReconciliation' }
        revisions: { type: array, items: { $ref: '#/components/schemas/ActualRevision' } }
        version: { type: integer, minimum: 1 }
    ClientPlanningAnalyzeCommand:
      type: object
      additionalProperties: false
      required: [version, quoteVersionId, fileName, mimeType, contentBase64]
      properties:
        version: { type: integer, minimum: 1 }
        quoteVersionId: { type: string }
        fileName: { type: string, minLength: 1, maxLength: 240 }
        mimeType: { type: string, maxLength: 160 }
        contentBase64: { type: string, minLength: 4, description: Fichier XLSX, CSV ou PDF de 5 Mio maximum avant décodage. }
    ClientPlanningApplyLinesCommand:
      type: object
      additionalProperties: false
      required: [version, quoteVersionId, clientPlanningImportId, items]
      properties:
        version: { type: integer, minimum: 1 }
        quoteVersionId: { type: string }
        clientPlanningImportId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ClientPlanningApplyLine' }
    ClientPlanningApplyLine:
      type: object
      additionalProperties: false
      required: [rowNumber]
      properties:
        rowNumber: { type: integer, minimum: 1 }
        sourceType: { type: string, enum: [resource] }
        sourceId: { type: string }
        category: { type: string }
        section: { type: string, maxLength: 160 }
        label: { type: string, minLength: 2, maxLength: 240 }
        unit: { type: string, maxLength: 40 }
        quantityMilli: { type: string, pattern: '^[1-9][0-9]*$' }
        requestedDurationDays: { type: integer, minimum: 1, maximum: 366 }
    QuotePlanningConversionCommand:
      type: object
      additionalProperties: false
      required: [version, quoteVersionId, items]
      properties:
        version: { type: integer, minimum: 1 }
        quoteVersionId: { type: string }
        clientPlanningImportId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [quoteLineId, startDate, resourceIds]
            properties:
              quoteLineId: { type: string }
              startDate: { type: string, format: date }
              durationDays: { type: integer, minimum: 1, maximum: 366 }
              resourceIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
              status: { type: string, enum: [option, confirmed] }
              startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              clientPlanningRowId: { type: string }
    ClientPlanningRevisionCommand:
      type: object
      additionalProperties: false
      required: [importVersion, corrections]
      properties:
        importVersion: { type: integer, minimum: 1 }
        corrections:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [rowNumber, suggestedResourceId, startDate, durationDays, startTime, endTime, resolutionNote, confirmed]
            properties:
              rowNumber: { type: integer, minimum: 1 }
              suggestedQuoteLineId: { type: string }
              suggestedResourceId: { type: string }
              label: { type: string, minLength: 2, maxLength: 240 }
              startDate: { type: string, format: date }
              durationDays: { type: integer, minimum: 1, maximum: 366 }
              startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              resolutionNote: { type: string, minLength: 3, maxLength: 500 }
              confirmed: { type: boolean, enum: [true] }
    ClientPlanningAnalysis:
      type: object
      required: [id, quoteId, quoteVersionId, status, version, currentRevisionNumber, rows, summary]
      properties:
        id: { type: string }
        quoteId: { type: string }
        quoteVersionId: { type: string }
        status: { type: string, enum: [analyzed, clarificationRequired, clarified, appliedToQuote] }
        version: { type: integer, minimum: 1 }
        currentRevisionNumber: { type: integer, minimum: 0 }
        rows: { type: array, maxItems: 250, items: { type: object, additionalProperties: true } }
        summary: { type: object, additionalProperties: true }
    BillingAddress:
      type: object
      additionalProperties: false
      required: [line1, postalCode, city, country]
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        postalCode: { type: string, maxLength: 24 }
        city: { type: string, maxLength: 120 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
    ClientCreateCommand:
      type: object
      additionalProperties: false
      required: [name, code, billingAddress]
      properties:
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 32 }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Facultative à la création ; hérite de la devise de la société active. }
        paymentTermsDays: { type: integer, minimum: 0, maximum: 365 }
        billingTerms: { type: string, maxLength: 1000 }
        billingAddress: { $ref: '#/components/schemas/BillingAddress' }
        active: { type: boolean, default: true }
    ProjectCreateCommand:
      type: object
      additionalProperties: false
      required: [name, code, clientId, siteId, salesOwnerId, projectManagerId, planningOwnerId]
      properties:
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 32 }
        clientId: { type: string }
        siteId: { type: string }
        lifecycleStatus: { $ref: '#/components/schemas/ProjectLifecycleStatus' }
        salesOwnerId: { type: string, description: Utilisateur actif et membre actif de la société. }
        projectManagerId: { type: string, description: Utilisateur actif et membre actif de la société. }
        planningOwnerId: { type: string, description: Utilisateur actif et membre actif de la société. }
        color: { type: string }
        active: { type: boolean, default: true }
        projectNumber: { type: string, maxLength: 48 }
        projectType: { type: string, maxLength: 160 }
        productionCompany: { type: string, maxLength: 160 }
        contactClient: { type: string, maxLength: 160 }
        salesOwner: { type: string, maxLength: 160 }
        projectManager: { type: string, maxLength: 160 }
        planningOwner: { type: string, maxLength: 160 }
        internalOwner: { type: string, maxLength: 160 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        description: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 4000 }
        costCenter: { type: string, maxLength: 160 }
    ResourceType:
      type: string
      enum: [room, suite, equipment, person, other]
    ResourceCategoryCreateCommand:
      type: object
      additionalProperties: false
      required: [siteId, code, name, resourceType]
      properties:
        siteId: { type: string }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 160 }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        active: { type: boolean, default: true }
    ResourceCategoryPatchCommand:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 160 }
        active: { type: boolean }
    ResourceCategory:
      allOf:
        - { $ref: '#/components/schemas/ResourceCategoryCreateCommand' }
        - type: object
          required: [id, companyId, version]
          properties:
            id: { type: string }
            companyId: { type: string, readOnly: true }
            version: { type: integer, minimum: 1 }
    ResourceCreateCommand:
      type: object
      additionalProperties: false
      required: [siteId, resourceCategoryId, name, type, capacity]
      properties:
        siteId: { type: string }
        resourceCategoryId: { type: string }
        name: { type: string, maxLength: 160 }
        type: { $ref: '#/components/schemas/ResourceType' }
        capacity: { type: integer, minimum: 1 }
        color: { type: string }
        active: { type: boolean, default: true }
    ProjectLifecycleStatus:
      type: string
      enum: [prospect, budget, quote, confirmed, to_plan, partially_planned, planned, production, completed, cancelled]
    ProjectSprint1Fields:
      type: object
      description: Champs Sprint 1 additifs ; le champ status RC1 reste lisible pendant la compatibilité.
      required: [lifecycleStatus, salesOwnerId, projectManagerId, planningOwnerId]
      properties:
        lifecycleStatus: { $ref: '#/components/schemas/ProjectLifecycleStatus' }
        legacyStatus: { type: string, readOnly: true }
        salesOwnerId: { type: string }
        projectManagerId: { type: string }
        planningOwnerId: { type: string }
    ServiceOfferingSprint1Fields:
      type: object
      required: [defaultUnit, plannable, compatibleResourceTypes, compatibleResourceCategoryIds]
      properties:
        defaultUnit: { type: string, enum: [heure, demi_journee, jour, semaine, mois, forfait, unite, go_mois, to_mois] }
        plannable: { type: boolean }
        compatibleResourceTypes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [room, suite, equipment, person, other] }
        compatibleResourceCategoryIds:
          type: array
          uniqueItems: true
          items: { type: string }
    RateSurcharge:
      type: object
      additionalProperties: false
      required: [kind, adjustmentBps, timezone]
      properties:
        kind: { type: string, enum: [weekend, night] }
        adjustmentBps: { type: integer, minimum: 0, maximum: 10000 }
        timezone: { type: string, description: Fuseau IANA utilisé pour qualifier la prestation. }
        startsAtLocal: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        endsAtLocal: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
    RateCreateCommand:
      type: object
      additionalProperties: false
      required: [rateCardId, sourceType, sourceId, unit, costUnitMinor, saleUnitMinor]
      properties:
        rateCardId: { type: string }
        sourceType: { type: string, enum: [resource, serviceOffering, manual, freeLine] }
        sourceId: { type: string }
        projectId: { type: string, description: Définit un tarif projet prioritaire. }
        clientId: { type: string, description: Définit un tarif client prioritaire. }
        unit: { type: string, maxLength: 40 }
        costUnitMinor: { type: string, pattern: '^\\d+$', description: Donnée interne modifiable uniquement avec finance.cost.manage. }
        saleUnitMinor: { type: string, pattern: '^\\d+$' }
        discountBps: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        validFrom: { type: string, format: date, default: '1970-01-01' }
        validTo: { type: [string, 'null'], format: date }
        surcharges:
          type: array
          items: { $ref: '#/components/schemas/RateSurcharge' }
        active: { type: boolean, default: true }
    Rate:
      allOf:
        - { $ref: '#/components/schemas/RateCreateCommand' }
        - type: object
          required: [id, companyId, scope, version]
          properties:
            id: { type: string }
            companyId: { type: string, readOnly: true }
            scope: { type: string, enum: [catalog, client, project], readOnly: true }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    RateResponse:
      description: Projection d'un tarif selon les permissions. Avec finance.read, la réponse est complète ; sinon costUnitMinor est absent.
      oneOf:
        - { $ref: '#/components/schemas/Rate' }
        - type: object
          additionalProperties: true
          required: [id, companyId, rateCardId, sourceType, sourceId, unit, saleUnitMinor, scope, version]
          not: { required: [costUnitMinor] }
          properties:
            id: { type: string }
            companyId: { type: string, readOnly: true }
            rateCardId: { type: string }
            sourceType: { type: string, enum: [resource, serviceOffering, manual, freeLine] }
            sourceId: { type: string }
            projectId: { type: string }
            clientId: { type: string }
            unit: { type: string, maxLength: 40 }
            saleUnitMinor: { type: string, pattern: '^\\d+$' }
            scope: { type: string, enum: [catalog, client, project], readOnly: true }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    QuoteLinePricingSnapshot:
      type: object
      description: Instantané du tarif retenu ; une ligne sans tarif reste en pricingStatus=missing et bloque l'envoi ou l'acceptation.
      required: [pricingStatus, priceOrigin]
      properties:
        pricingStatus: { type: string, enum: [resolved, missing] }
        priceOrigin: { type: string, enum: [project, client, catalog, manual, missing] }
        appliedRateId: { type: string }
        appliedRateVersion: { type: integer, minimum: 1 }
        appliedRateSnapshot: { type: object, additionalProperties: true }
    UniversalSearchResult:
      type: object
      additionalProperties: false
      required: [type, id, label, secondaryLabel, href]
      properties:
        type: { type: string, enum: [client, project, quote, resource, person, serviceOffering] }
        id: { type: string }
        label: { type: string }
        secondaryLabel: { type: string }
        href: { type: string, pattern: '^#' }
        siteId: { type: string }
        projectId: { type: string }
    UniversalSearchResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, query, types]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UniversalSearchResult' } }
        page: { type: integer, const: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        query: { type: string }
        types: { type: array, uniqueItems: true, items: { type: string, enum: [client, project, quote, resource, person, serviceOffering] } }
    AnalyticsDimensionName:
      type: string
      enum: [date, clientId, projectId, serviceOfferingId, resourceId, siteId, legalEntityId, salesOwnerId, userId]
    RevenueStageName:
      type: string
      enum: [budgeted, quoted, signed, planned, actual, billable, invoiced, collected]
    AnalyticsDimensionsResponse:
      type: object
      additionalProperties: false
      required: [definitionVersion, dimensions, stages, recognizedRevenueStage]
      properties:
        definitionVersion: { type: string, const: revenue-chain-g7-v1 }
        dimensions:
          type: array
          minItems: 9
          maxItems: 9
          items:
            type: object
            additionalProperties: false
            required: [name, nullable]
            properties:
              name: { $ref: '#/components/schemas/AnalyticsDimensionName' }
              nullable: { type: boolean }
        stages:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [name, availability]
            properties:
              name: { $ref: '#/components/schemas/RevenueStageName' }
              availability: { type: string, enum: [available, unavailable] }
        recognizedRevenueStage: { type: string, const: signed }
    RevenueChainStage:
      type: object
      additionalProperties: false
      required: [stage, availability, valueMinor, sourceCount, sourceIds]
      properties:
        stage: { $ref: '#/components/schemas/RevenueStageName' }
        availability: { type: string, enum: [available, unavailable] }
        valueMinor: { type: [string, 'null'], pattern: '^[0-9]+$' }
        sourceCount: { type: integer, minimum: 0 }
        sourceIds: { type: array, uniqueItems: true, items: { type: string } }
    RevenueChainGroup:
      type: object
      additionalProperties: false
      required: [currency, currencyExponent, dimensions, stages]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyExponent: { type: integer, enum: [0, 2, 3] }
        dimensions: { type: object, additionalProperties: true }
        stages: { type: array, minItems: 8, maxItems: 8, items: { $ref: '#/components/schemas/RevenueChainStage' } }
    RevenueChainResponse:
      type: object
      additionalProperties: false
      required: [period, dimensions, filters, definitionVersion, generatedAt, groups]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: [string, 'null'], format: date }
            to: { type: [string, 'null'], format: date }
        dimensions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/AnalyticsDimensionName' } }
        filters: { type: object, additionalProperties: true }
        definitionVersion: { type: string, const: revenue-chain-g7-v1 }
        generatedAt: { type: string, format: date-time }
        groups: { type: array, items: { $ref: '#/components/schemas/RevenueChainGroup' } }
    FinanceBacklogResponse:
      type: object
      additionalProperties: false
      required: [definitionVersion, generatedAt, asOf, currency, filters, freshness, sources, totals, items, itemCount]
      properties:
        definitionVersion: { type: string, const: 'FINANCE_BACKLOG@1' }
        generatedAt: { type: string, format: date-time }
        asOf: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        filters: { type: object, additionalProperties: true }
        freshness: { type: object, additionalProperties: true }
        sources: { type: object, additionalProperties: true }
        totals:
          type: object
          required: [signedRevenueMinor, earnedSignedRevenueMinor, backlogMinor]
          properties:
            signedRevenueMinor: { type: string, pattern: '^[0-9]+$' }
            earnedSignedRevenueMinor: { type: string, pattern: '^[0-9]+$' }
            backlogMinor: { type: string, pattern: '^[0-9]+$' }
        items: { type: array, items: { $ref: '#/components/schemas/FinanceBacklogItem' } }
        itemCount: { type: integer, minimum: 0 }
